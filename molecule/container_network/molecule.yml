---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: qbittorrent-${MOLECULE_DISTRO:-ubuntu2604}-container-network
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        qbittorrent_uid: 1000
        qbittorrent_gid: 1000
        qbittorrent_hostname: localhost
        qbittorrent_container_labels_traefik_enabled: false
        qbittorrent_container_network_mode: container
        qbittorrent_container_network_container: qbittorrent-synthetic-owner
        qbittorrent_container_network_container_contract_label: io.mash.test.fail-closed-contract
        qbittorrent_container_network_container_contract_label_value: synthetic-v1
        qbittorrent_container_network_container_systemd_service: qbittorrent-synthetic-owner.service
        qbittorrent_container_network_container_resolv_conf_path: /opt/qbittorrent-synthetic-owner/resolv.conf
        qbittorrent_container_network_container_healthcheck_retries: 2
        qbittorrent_container_network_container_healthcheck_retry_delay_seconds: 1
        qbittorrent_container_network_container_systemd_start_timeout_margin_seconds: 15
        qbittorrent_synthetic_owner_image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
