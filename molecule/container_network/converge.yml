---
- name: Include roles for qBittorrent container-network Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for qBittorrent container-network Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Start the synthetic owner and qBittorrent
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure synthetic namespace owner is enabled and started
      ansible.builtin.systemd_service:
        name: qbittorrent-synthetic-owner.service
        enabled: true
        state: started
