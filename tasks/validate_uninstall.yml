---
- name: Validate qBittorrent uninstall identity and command settings
  ansible.builtin.assert:
    that:
      - qbittorrent_identifier is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - qbittorrent_identifier is not match('^[a-f0-9]+$')
      - >-
        qbittorrent_systemd_systemctl_command
        is match('^/[A-Za-z0-9_./-]+$')
      - "'//' not in qbittorrent_systemd_systemctl_command"
      - "'.' not in qbittorrent_systemd_systemctl_command.split('/')"
      - "'..' not in qbittorrent_systemd_systemctl_command.split('/')"
      - >-
        devture_systemd_docker_base_host_command_docker
        is match('^/[A-Za-z0-9_./-]+$')
      - "'//' not in devture_systemd_docker_base_host_command_docker"
      - >-
        '..'
        not in devture_systemd_docker_base_host_command_docker.split('/')
      - >-
        devture_systemd_docker_base_systemd_path
        is match('^/(?:etc|run|usr/lib)/systemd/system$')
    fail_msg: >-
      qBittorrent lifecycle identity, command, or systemd settings are unsafe.
      Nothing has been stopped or removed.

- name: Check the existing qBittorrent unit before lifecycle mutation
  ansible.builtin.stat:
    path: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_identifier
        + '.service'
      }}
    follow: false
  register: qbittorrent_existing_unit_stat

- name: Require an existing qBittorrent unit path to be a safe object
  when: qbittorrent_existing_unit_stat.stat.exists | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_existing_unit_stat.stat.isreg | bool
      - not qbittorrent_existing_unit_stat.stat.islnk | default(false) | bool
    fail_msg: >-
      The existing qBittorrent unit path is not a real file. It has not been
      read, stopped, overwritten, disabled, or deleted.

- name: Read the existing qBittorrent unit before lifecycle mutation
  when: qbittorrent_existing_unit_stat.stat.exists | bool
  ansible.builtin.slurp:
    src: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_identifier
        + '.service'
      }}
  register: qbittorrent_existing_unit_content

- name: Require an existing qBittorrent unit to be role-recognizable
  when: qbittorrent_existing_unit_stat.stat.exists | bool
  vars:
    qbittorrent_existing_unit_lines: >-
      {{ (qbittorrent_existing_unit_content.content | b64decode).splitlines() }}
  ansible.builtin.assert:
    that:
      - >-
        '# MASH-Role=qBittorrent' in qbittorrent_existing_unit_lines
        or
        (
          'Description=qBittorrent (' + qbittorrent_identifier + ')'
          in qbittorrent_existing_unit_lines
          and
          'SyslogIdentifier=' + qbittorrent_identifier
          in qbittorrent_existing_unit_lines
          and 'Type=simple' in qbittorrent_existing_unit_lines
          and 'Restart=always' in qbittorrent_existing_unit_lines
          and 'RestartSec=30' in qbittorrent_existing_unit_lines
          and 'WantedBy=multi-user.target' in qbittorrent_existing_unit_lines
          and
          (
            (
              'ExecStart='
              + devture_systemd_docker_base_host_command_docker
              + ' start --attach '
              + qbittorrent_identifier
            )
            in qbittorrent_existing_unit_lines
            and
            (
              qbittorrent_existing_unit_lines
              | select(
                'match',
                '^ExecStartPre='
                + devture_systemd_docker_base_host_command_docker
                + ' create'
              )
              | list
              | length
            )
            == 1
            or
            (
              '# MASH-NetworkNamespaceIdentity=resolved-full-container-id'
              in qbittorrent_existing_unit_lines
              and
              (
                qbittorrent_existing_unit_lines
                | select(
                  'match',
                  '^ExecStart='
                  + devture_systemd_docker_base_systemd_path
                  + '/'
                  + qbittorrent_identifier
                  + '-container-network-helper start$'
                )
                | list
                | length
              )
              == 1
            )
          )
        )
    fail_msg: >-
      The existing `{{ qbittorrent_identifier }}.service` unit is not
      recognizable as a qBittorrent role unit. It will not be stopped,
      overwritten, disabled, or deleted.

- name: Record the existing qBittorrent unit contract
  ansible.builtin.set_fact:
    qbittorrent_existing_unit_has_role_marker: >-
      {{
        qbittorrent_existing_unit_stat.stat.exists | bool
        and
        '# MASH-Role=qBittorrent'
        in (
          (
            qbittorrent_existing_unit_content.content
            | default('')
            | b64decode
          ).splitlines()
        )
      }}
    qbittorrent_existing_unit_uses_container_network: >-
      {{
        qbittorrent_existing_unit_stat.stat.exists | bool
        and
        (
          (
            (
              qbittorrent_existing_unit_content.content
              | default('')
              | b64decode
            ).splitlines()
            | select('match', '^# MASH-NetworkNamespaceOwner=')
            | list
            | length
          )
          == 1
        )
      }}

- name: Inspect the persistent qBittorrent quiesce directory
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ qbittorrent_identifier }}.service.d"
    follow: false
  register: qbittorrent_existing_quiesce_directory_stat

- name: Require an existing qBittorrent quiesce directory to be safe
  when: qbittorrent_existing_quiesce_directory_stat.stat.exists | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_existing_quiesce_directory_stat.stat.isdir | bool
      - >-
        not
        qbittorrent_existing_quiesce_directory_stat.stat.islnk
        | default(false)
        | bool
    fail_msg: >-
      The persistent qBittorrent drop-in path is not a real directory. No
      lifecycle mutation has been applied.

- name: Inspect an existing persistent qBittorrent quiesce drop-in
  ansible.builtin.stat:
    path: >-
      /etc/systemd/system/{{ qbittorrent_identifier }}.service.d/zzzz-mash-fail-closed-quiesce.conf
    follow: false
  register: qbittorrent_existing_quiesce_dropin_stat

- name: Require an existing qBittorrent quiesce drop-in path to be safe
  when: qbittorrent_existing_quiesce_dropin_stat.stat.exists | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_existing_quiesce_dropin_stat.stat.isreg | bool
      - >-
        not
        qbittorrent_existing_quiesce_dropin_stat.stat.islnk
        | default(false)
        | bool
    fail_msg: >-
      The reserved qBittorrent quiesce drop-in path is not a real file. It has
      not been read, overwritten, or removed.

- name: Read an existing persistent qBittorrent quiesce drop-in
  when: qbittorrent_existing_quiesce_dropin_stat.stat.exists | bool
  ansible.builtin.slurp:
    src: >-
      /etc/systemd/system/{{ qbittorrent_identifier }}.service.d/zzzz-mash-fail-closed-quiesce.conf
  register: qbittorrent_existing_quiesce_dropin_content

- name: Require an existing qBittorrent quiesce drop-in to be role-owned
  when: qbittorrent_existing_quiesce_dropin_stat.stat.exists | bool
  ansible.builtin.assert:
    that:
      - >-
        '# MASH-Role=qBittorrent-quiesce'
        in (
          qbittorrent_existing_quiesce_dropin_content.content
          | b64decode
        )
    fail_msg: >-
      The reserved qBittorrent quiesce drop-in path is occupied by an
      unrecognized object. It has not been overwritten or removed.

- name: Record an adoptable persistent qBittorrent quiesce
  ansible.builtin.set_fact:
    qbittorrent_existing_quiesce_dropin_owned: >-
      {{ qbittorrent_existing_quiesce_dropin_stat.stat.exists | bool }}

- name: Check the existing qBittorrent container-network helper
  ansible.builtin.stat:
    path: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_identifier
        + '-container-network-helper'
      }}
    follow: false
  register: qbittorrent_existing_container_network_helper_stat

- name: Require an existing qBittorrent helper path to be a safe object
  when: qbittorrent_existing_container_network_helper_stat.stat.exists | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_existing_container_network_helper_stat.stat.isreg | bool
      - >-
        not
        qbittorrent_existing_container_network_helper_stat.stat.islnk
        | default(false)
        | bool
    fail_msg: >-
      The existing qBittorrent helper path is not a real file. It has not been
      read, overwritten, or deleted.

- name: Read the existing qBittorrent container-network helper
  when: qbittorrent_existing_container_network_helper_stat.stat.exists | bool
  ansible.builtin.slurp:
    src: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_identifier
        + '-container-network-helper'
      }}
  register: qbittorrent_existing_container_network_helper_content

- name: Require an existing qBittorrent helper to be role-recognizable
  when: qbittorrent_existing_container_network_helper_stat.stat.exists | bool
  vars:
    qbittorrent_existing_helper_text: >-
      {{ qbittorrent_existing_container_network_helper_content.content | b64decode }}
  ansible.builtin.assert:
    that:
      - >-
        '# MASH-Role=qBittorrent-container-network-helper'
        in qbittorrent_existing_helper_text
        or
        (
          'owner_state_file="$state_directory/owner-id"'
          in qbittorrent_existing_helper_text
          and
          'qbittorrent_state_file="$state_directory/qbittorrent-id"'
          in qbittorrent_existing_helper_text
        )
    fail_msg: >-
      The existing qBittorrent container-network helper is not recognizable as
      role-owned. It will not be overwritten or deleted.

- name: Record the existing helper's fail-closed contract
  ansible.builtin.set_fact:
    qbittorrent_existing_helper_has_fail_closed_contract: >-
      {{
        qbittorrent_existing_container_network_helper_stat.stat.exists | bool
        and
        '# MASH-FailClosedContract=v1'
        in (
          qbittorrent_existing_container_network_helper_content.content
          | default('')
          | b64decode
        ).splitlines()
      }}

- name: Query the effective qBittorrent unit before lifecycle mutation
  ansible.builtin.command:
    argv:
      - "{{ qbittorrent_systemd_systemctl_command }}"
      - show
      - --property=LoadState
      - --property=FragmentPath
      - --property=DropInPaths
      - --property=ActiveState
      - --property=Job
      - --property=MainPID
      - --property=ControlPID
      - "{{ qbittorrent_identifier }}.service"
  register: qbittorrent_pre_mutation_unit_state_result
  changed_when: false
  failed_when: false

- name: Require complete effective qBittorrent state before lifecycle mutation
  vars:
    qbittorrent_pre_mutation_property_names:
      - LoadState
      - FragmentPath
      - DropInPaths
      - ActiveState
      - Job
      - MainPID
      - ControlPID
  ansible.builtin.assert:
    that:
      - qbittorrent_pre_mutation_unit_state_result.rc == 0
      - >-
        (
          qbittorrent_pre_mutation_unit_state_result.stdout_lines
          | select('match', '^' + item + '=')
          | list
          | length
        )
        == 1
    fail_msg: >-
      The effective qBittorrent systemd identity or runtime state could not be
      queried unambiguously. No lifecycle mutation has been applied.
  loop: "{{ qbittorrent_pre_mutation_property_names }}"

- name: Classify a diskless cached qBittorrent quiesce guard
  vars:
    qbittorrent_cached_guard_path: >-
      /etc/systemd/system/{{ qbittorrent_identifier }}.service.d/zzzz-mash-fail-closed-quiesce.conf
    qbittorrent_effective_dropin_paths: >-
      {{
        (
          qbittorrent_pre_mutation_unit_state_result.stdout_lines
          | select('match', '^DropInPaths=')
          | first
          | regex_replace('^DropInPaths=', '')
        ).split()
      }}
  ansible.builtin.set_fact:
    qbittorrent_existing_quiesce_cached_guard_candidate: >-
      {{
        not qbittorrent_existing_quiesce_dropin_stat.stat.exists | bool
        and qbittorrent_effective_dropin_paths
        == [qbittorrent_cached_guard_path]
      }}
    qbittorrent_existing_quiesce_cached_guard_safe: false

- name: Verify the loaded lifecycle of a diskless cached qBittorrent guard
  when:
    - qbittorrent_existing_quiesce_cached_guard_candidate | bool
    - >-
      (
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^LoadState=')
        | first
        | regex_replace('^LoadState=', '')
      )
      == 'loaded'
  ansible.builtin.include_tasks: >-
    {{ role_path }}/tasks/verify_quiesce_unit.yml

- name: Query exact-name container state for a diskless cached qBittorrent guard
  when: qbittorrent_existing_quiesce_cached_guard_candidate | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - "name=^/{{ qbittorrent_identifier | replace('.', '[.]') }}$"
      - "--format={{ '{{' }}.ID{{ '}}' }}"
  register: qbittorrent_cached_guard_container_query_result
  changed_when: false
  failed_when: false

- name: Prove a diskless cached qBittorrent guard is safe to recover
  when: qbittorrent_existing_quiesce_cached_guard_candidate | bool
  vars:
    qbittorrent_cached_guard_expected_fragment_path: >-
      {{ devture_systemd_docker_base_systemd_path }}/{{ qbittorrent_identifier }}.service
    qbittorrent_cached_guard_load_state: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^LoadState=')
        | first
        | regex_replace('^LoadState=', '')
      }}
    qbittorrent_cached_guard_fragment_path: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^FragmentPath=')
        | first
        | regex_replace('^FragmentPath=', '')
      }}
    qbittorrent_cached_guard_active_state: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^ActiveState=')
        | first
        | regex_replace('^ActiveState=', '')
      }}
    qbittorrent_cached_guard_job: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^Job=')
        | first
        | regex_replace('^Job=', '')
      }}
    qbittorrent_cached_guard_process_ids: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^(MainPID|ControlPID)=')
        | map('regex_replace', '^(MainPID|ControlPID)=', '')
        | list
      }}
  ansible.builtin.assert:
    that:
      - >-
        (
          qbittorrent_cached_guard_load_state == 'loaded'
          and
          qbittorrent_cached_guard_fragment_path
          == qbittorrent_cached_guard_expected_fragment_path
        )
        or
        (
          qbittorrent_cached_guard_load_state == 'not-found'
          and qbittorrent_cached_guard_fragment_path | length == 0
        )
      - >-
        qbittorrent_cached_guard_active_state
        in ['inactive', 'failed', 'unknown']
      - qbittorrent_cached_guard_job in ['', '0', '[0 /]']
      - >-
        qbittorrent_cached_guard_process_ids
        | difference(['0'])
        | length
        == 0
      - qbittorrent_cached_guard_container_query_result.rc == 0
      - >-
        qbittorrent_cached_guard_container_query_result.stdout
        | trim
        | length
        == 0
    fail_msg: >-
      The reserved qBittorrent guard is cached by systemd but absent on disk,
      and its inactive, process-free, container-free recovery state could not
      be proven. It has not been adopted or recreated.

- name: Record a safely recoverable diskless cached qBittorrent guard
  when: qbittorrent_existing_quiesce_cached_guard_candidate | bool
  ansible.builtin.set_fact:
    qbittorrent_existing_quiesce_cached_guard_safe: true

- name: Prove effective qBittorrent unit ownership before lifecycle mutation
  vars:
    qbittorrent_pre_mutation_expected_fragment_path: >-
      {{ devture_systemd_docker_base_systemd_path }}/{{ qbittorrent_identifier }}.service
    qbittorrent_pre_mutation_load_state: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^LoadState=')
        | first
        | regex_replace('^LoadState=', '')
      }}
    qbittorrent_pre_mutation_fragment_path: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^FragmentPath=')
        | first
        | regex_replace('^FragmentPath=', '')
      }}
    qbittorrent_pre_mutation_dropin_paths: >-
      {{
        (
          qbittorrent_pre_mutation_unit_state_result.stdout_lines
          | select('match', '^DropInPaths=')
          | first
          | regex_replace('^DropInPaths=', '')
        ).split()
      }}
    qbittorrent_pre_mutation_owned_guard_path: >-
      /etc/systemd/system/{{ qbittorrent_identifier }}.service.d/zzzz-mash-fail-closed-quiesce.conf
    qbittorrent_pre_mutation_active_state: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^ActiveState=')
        | first
        | regex_replace('^ActiveState=', '')
      }}
    qbittorrent_pre_mutation_job: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^Job=')
        | first
        | regex_replace('^Job=', '')
      }}
    qbittorrent_pre_mutation_main_pid: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^MainPID=')
        | first
        | regex_replace('^MainPID=', '')
      }}
    qbittorrent_pre_mutation_control_pid: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^ControlPID=')
        | first
        | regex_replace('^ControlPID=', '')
      }}
  ansible.builtin.assert:
    that:
      - >-
        qbittorrent_pre_mutation_dropin_paths | length == 0
        or
        (
          qbittorrent_existing_quiesce_dropin_owned
          | default(false)
          | bool
          and
          qbittorrent_pre_mutation_dropin_paths
          == [qbittorrent_pre_mutation_owned_guard_path]
        )
        or
        (
          qbittorrent_existing_quiesce_cached_guard_safe
          | default(false)
          | bool
          and
          qbittorrent_pre_mutation_dropin_paths
          == [qbittorrent_pre_mutation_owned_guard_path]
        )
      - >-
        (
          qbittorrent_existing_unit_stat.stat.exists | bool
          and qbittorrent_pre_mutation_load_state == 'loaded'
          and
          qbittorrent_pre_mutation_fragment_path
          == qbittorrent_pre_mutation_expected_fragment_path
        )
        or
        (
          qbittorrent_pre_mutation_load_state == 'not-found'
          and qbittorrent_pre_mutation_fragment_path | length == 0
          and
          qbittorrent_pre_mutation_active_state
          in ['inactive', 'failed', 'unknown']
          and qbittorrent_pre_mutation_job in ['', '0', '[0 /]']
          and qbittorrent_pre_mutation_main_pid == '0'
          and qbittorrent_pre_mutation_control_pid == '0'
        )
    fail_msg: >-
      The effective same-name qBittorrent unit or drop-in set is foreign,
      transient, or stale-active. Only the recognized role fragment at
      `{{ qbittorrent_pre_mutation_expected_fragment_path }}` with no drop-ins
      or the disk-attested role guard, a separately proven safe cached reserved
      guard, or an inert not-found state with no job or process IDs, may precede
      lifecycle mutation.

- name: Classify the intended namespace-owner identity for early attestation
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_target_identity_valid: >-
      {{
        qbittorrent_container_network_mode == 'container'
        and
        qbittorrent_container_network_container
        | string
        is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        and
        qbittorrent_container_network_container
        | string
        is not match('^[a-f0-9]+$')
        and
        qbittorrent_container_network_container_contract_label
        | string
        is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        and
        qbittorrent_container_network_container_contract_label_value
        | string
        is match('^[^|\r\n]+$')
        and
        qbittorrent_container_network_container_systemd_service
        | string
        is match('^[A-Za-z0-9][A-Za-z0-9:_.@-]*[.]service$')
        and
        qbittorrent_container_network_container_systemd_service
        != qbittorrent_identifier + '.service'
        and qbittorrent_data_path | string is match('^/(?!/)[^,\r\n]+$')
        and qbittorrent_download_path | string is match('^/(?!/)[^,\r\n]+$')
        and
        qbittorrent_container_network_container_resolv_conf_path
        | string
        is match('^/(?!/)[^,\r\n]+$')
        and
        qbittorrent_download_bind_path
        | string
        is match('^/(?!/)[^,\r\n]+$')
        and
        qbittorrent_data_path
        | string
        is not search('(?:^|/)[.]{1,2}(?:/|$)')
        and
        qbittorrent_download_path
        | string
        is not search('(?:^|/)[.]{1,2}(?:/|$)')
        and
        qbittorrent_container_network_container_resolv_conf_path
        | string
        is not search('(?:^|/)[.]{1,2}(?:/|$)')
        and
        qbittorrent_download_bind_path
        | string
        is not search('(?:^|/)[.]{1,2}(?:/|$)')
        and
        qbittorrent_data_path
        | string
        is not match('^/(?:$|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sys(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
        and
        qbittorrent_download_path
        | string
        is not match('^/(?:$|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sys(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
        and
        qbittorrent_container_network_container_resolv_conf_path
        | string
        is not match('^/(?:$|bin(?:/|$)|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|lib(?:32|64)?(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sbin(?:/|$)|sys(?:/|$)|usr(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
        and
        qbittorrent_download_bind_path
        | string
        is not match('^/(?:$|config|dev|etc|proc|run|sys)(?:/|$)')
        and
        (
          not qbittorrent_container_network_enforcement_enabled
          | default(false)
          | bool
          or
          (
            qbittorrent_container_network_enforcement_intent
            | default(false)
            | bool
            and
            qbittorrent_container_network_enforcement_owner_enabled
            | default(false)
            | bool
            and
            qbittorrent_container_network_container
            ==
            qbittorrent_container_network_enforcement_expected_owner_container
            and
            qbittorrent_container_network_container_contract_label
            ==
            qbittorrent_container_network_enforcement_expected_owner_contract_label
            and
            qbittorrent_container_network_container_contract_label_value
            ==
            qbittorrent_container_network_enforcement_expected_owner_contract_label_value
            and
            qbittorrent_container_network_container_systemd_service
            ==
            qbittorrent_container_network_enforcement_expected_owner_systemd_service
            and
            qbittorrent_container_network_container_resolv_conf_path
            ==
            qbittorrent_container_network_enforcement_expected_resolv_conf_path
          )
        )
      }}
    qbittorrent_existing_fail_closed_owner_id: ""
    qbittorrent_existing_fail_closed_owner_contract_valid: false
    qbittorrent_existing_fail_closed_owner_systemd_contract_valid: false
    qbittorrent_existing_fail_closed_owner_inspect: {}

- name: Query the intended namespace-owner systemd contract
  when:
    - qbittorrent_existing_fail_closed_target_identity_valid | bool
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
  ansible.builtin.command:
    argv:
      - "{{ qbittorrent_systemd_systemctl_command }}"
      - show
      - --property=LoadState
      - --property=FragmentPath
      - --property=ActiveState
      - --property=Job
      - --property=MainPID
      - "{{ qbittorrent_container_network_container_systemd_service }}"
  register: qbittorrent_existing_fail_closed_owner_systemd_result
  changed_when: false
  failed_when: false

- name: Attest the intended namespace-owner systemd contract
  when:
    - qbittorrent_existing_fail_closed_target_identity_valid | bool
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
  vars:
    qbittorrent_existing_fail_closed_owner_systemd_load_state: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.stdout_lines
        | default([])
        | select('match', '^LoadState=')
        | map('regex_replace', '^LoadState=', '')
        | first
        | default('')
      }}
    qbittorrent_existing_fail_closed_owner_systemd_fragment_path: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.stdout_lines
        | default([])
        | select('match', '^FragmentPath=')
        | map('regex_replace', '^FragmentPath=', '')
        | first
        | default('')
      }}
    qbittorrent_existing_fail_closed_owner_systemd_active_state: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.stdout_lines
        | default([])
        | select('match', '^ActiveState=')
        | map('regex_replace', '^ActiveState=', '')
        | first
        | default('')
      }}
    qbittorrent_existing_fail_closed_owner_systemd_job: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.stdout_lines
        | default([])
        | select('match', '^Job=')
        | map('regex_replace', '^Job=', '')
        | first
        | default('invalid')
      }}
    qbittorrent_existing_fail_closed_owner_systemd_main_pid: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.stdout_lines
        | default([])
        | select('match', '^MainPID=')
        | map('regex_replace', '^MainPID=', '')
        | first
        | default('')
      }}
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_owner_systemd_contract_valid: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_result.rc == 0
        and
        qbittorrent_existing_fail_closed_owner_systemd_load_state == 'loaded'
        and
        qbittorrent_existing_fail_closed_owner_systemd_fragment_path
        ==
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_container_network_container_systemd_service
        and
        qbittorrent_existing_fail_closed_owner_systemd_active_state == 'active'
        and
        qbittorrent_existing_fail_closed_owner_systemd_job
        in ['', '0', '[0 /]']
        and
        qbittorrent_existing_fail_closed_owner_systemd_main_pid
        is match('^[1-9][0-9]*$')
      }}

- name: Query the intended namespace-owner identity for early attestation
  when:
    - qbittorrent_existing_fail_closed_target_identity_valid | bool
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - >-
        name=^/{{
          qbittorrent_container_network_container
          | replace('.', '[.]')
        }}$
      - "--format={{ '{{' }}.ID{{ '}}' }}|{{ '{{' }}.Names{{ '}}' }}"
  register: qbittorrent_existing_fail_closed_owner_query_result
  changed_when: false
  failed_when: false

- name: Record an exact intended namespace-owner ID
  when:
    - qbittorrent_existing_fail_closed_target_identity_valid | bool
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
    - qbittorrent_existing_fail_closed_owner_query_result.rc == 0
    - >-
      qbittorrent_existing_fail_closed_owner_query_result.stdout_lines
      | default([])
      | reject('equalto', '')
      | list
      | length
      == 1
    - >-
      (
        qbittorrent_existing_fail_closed_owner_query_result.stdout_lines
        | reject('equalto', '')
        | list
        | first
      ).split('|')
      | length
      == 2
    - >-
      (
        qbittorrent_existing_fail_closed_owner_query_result.stdout_lines
        | reject('equalto', '')
        | list
        | first
      ).split('|')[0]
      is match('^[a-f0-9]{64}$')
    - >-
      (
        qbittorrent_existing_fail_closed_owner_query_result.stdout_lines
        | reject('equalto', '')
        | list
        | first
      ).split('|')[1]
      == qbittorrent_container_network_container
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_owner_id: >-
      {{
        (
          qbittorrent_existing_fail_closed_owner_query_result.stdout_lines
          | reject('equalto', '')
          | list
          | first
        ).split('|')[0]
      }}

- name: Inspect the intended namespace-owner contract for early attestation
  when: qbittorrent_existing_fail_closed_owner_id | length > 0
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - inspect
      - "--format={{ '{{' }}json .{{ '}}' }}"
      - "{{ qbittorrent_existing_fail_closed_owner_id }}"
  register: qbittorrent_existing_fail_closed_owner_inspect_result
  changed_when: false
  failed_when: false
  no_log: true

- name: Parse the intended namespace-owner contract for early attestation
  when:
    - qbittorrent_existing_fail_closed_owner_id | length > 0
    - qbittorrent_existing_fail_closed_owner_inspect_result.rc == 0
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_owner_inspect: >-
      {{
        qbittorrent_existing_fail_closed_owner_inspect_result.stdout
        | from_json
      }}
  no_log: true

- name: Attest the intended namespace-owner contract
  when:
    - qbittorrent_existing_fail_closed_owner_id | length > 0
    - qbittorrent_existing_fail_closed_owner_inspect_result.rc == 0
  vars:
    qbittorrent_existing_fail_closed_owner_config: >-
      {{ qbittorrent_existing_fail_closed_owner_inspect.Config | default({}) }}
    qbittorrent_existing_fail_closed_owner_labels: >-
      {{
        qbittorrent_existing_fail_closed_owner_config.Labels
        | default({}, true)
      }}
    qbittorrent_existing_fail_closed_owner_health: >-
      {{
        qbittorrent_existing_fail_closed_owner_inspect.State.Health
        | default({})
      }}
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_owner_contract_valid: >-
      {{
        qbittorrent_existing_fail_closed_owner_systemd_contract_valid | bool
        and
        qbittorrent_existing_fail_closed_owner_inspect.Id
        == qbittorrent_existing_fail_closed_owner_id
        and
        qbittorrent_existing_fail_closed_owner_inspect.Name
        == '/' + qbittorrent_container_network_container
        and
        qbittorrent_existing_fail_closed_owner_inspect.State.Running
        | default(false)
        | bool
        and
        qbittorrent_existing_fail_closed_owner_health.Status
        | default('')
        == 'healthy'
        and
        qbittorrent_existing_fail_closed_owner_labels.get(
          qbittorrent_container_network_container_contract_label,
          ''
        )
        == qbittorrent_container_network_container_contract_label_value
      }}
  no_log: true

- name: Initialize existing qBittorrent fail-closed container attestation
  ansible.builtin.set_fact:
    qbittorrent_existing_container_fail_closed_contract_valid: false
    qbittorrent_existing_container_fail_closed_contract_id: ""
    qbittorrent_existing_fail_closed_container_inspect: {}

- name: Query the existing container-network qBittorrent identity
  when:
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - "name=^/{{ qbittorrent_identifier | replace('.', '[.]') }}$"
      - "--format={{ '{{' }}.ID{{ '}}' }}|{{ '{{' }}.Names{{ '}}' }}"
  register: qbittorrent_existing_fail_closed_container_query_result
  changed_when: false
  failed_when: false

- name: Require an unambiguous existing container-network qBittorrent identity
  when:
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
  vars:
    qbittorrent_existing_fail_closed_container_query_lines: >-
      {{
        qbittorrent_existing_fail_closed_container_query_result.stdout_lines
        | default([])
        | reject('equalto', '')
        | list
      }}
  ansible.builtin.assert:
    that:
      - qbittorrent_existing_fail_closed_container_query_result.rc == 0
      - >-
        qbittorrent_existing_fail_closed_container_query_lines | length == 0
        or
        (
          qbittorrent_existing_fail_closed_container_query_lines | length == 1
          and
          qbittorrent_existing_fail_closed_container_query_lines[0].split('|')
          | length
          == 2
          and
          qbittorrent_existing_fail_closed_container_query_lines[0].split('|')[0]
          is match('^[a-f0-9]{64}$')
          and
          qbittorrent_existing_fail_closed_container_query_lines[0].split('|')[1]
          == qbittorrent_identifier
        )
    fail_msg: >-
      The existing container-network qBittorrent identity cannot be attested.
      It has not been treated as a current fail-closed container.

- name: Record the existing container-network qBittorrent ID
  when:
    - qbittorrent_existing_unit_stat.stat.exists | bool
    - qbittorrent_existing_unit_uses_container_network | bool
    - >-
      qbittorrent_existing_fail_closed_container_query_result.stdout_lines
      | default([])
      | reject('equalto', '')
      | list
      | length
      == 1
  ansible.builtin.set_fact:
    qbittorrent_existing_container_fail_closed_contract_id: >-
      {{
        (
          qbittorrent_existing_fail_closed_container_query_result.stdout_lines
          | reject('equalto', '')
          | list
          | first
        ).split('|')[0]
      }}

- name: Inspect the existing container-network qBittorrent contract
  when:
    - qbittorrent_existing_container_fail_closed_contract_id | length > 0
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - inspect
      - "--format={{ '{{' }}json .{{ '}}' }}"
      - "{{ qbittorrent_existing_container_fail_closed_contract_id }}"
  register: qbittorrent_existing_fail_closed_container_inspect_result
  changed_when: false
  failed_when: false
  no_log: true

- name: Parse the existing container-network qBittorrent contract
  when:
    - qbittorrent_existing_container_fail_closed_contract_id | length > 0
    - qbittorrent_existing_fail_closed_container_inspect_result.rc == 0
  ansible.builtin.set_fact:
    qbittorrent_existing_fail_closed_container_inspect: >-
      {{
        qbittorrent_existing_fail_closed_container_inspect_result.stdout
        | from_json
      }}
  no_log: true

- name: Attest the existing container-network qBittorrent contract
  when:
    - qbittorrent_existing_container_fail_closed_contract_id | length > 0
    - qbittorrent_existing_fail_closed_container_inspect_result.rc == 0
  vars:
    qbittorrent_existing_fail_closed_config: >-
      {{ qbittorrent_existing_fail_closed_container_inspect.Config | default({}) }}
    qbittorrent_existing_fail_closed_host_config: >-
      {{
        qbittorrent_existing_fail_closed_container_inspect.HostConfig
        | default({})
      }}
    qbittorrent_existing_fail_closed_labels: >-
      {{
        qbittorrent_existing_fail_closed_config.Labels
        | default({}, true)
      }}
    qbittorrent_existing_fail_closed_environment: >-
      {{
        qbittorrent_existing_fail_closed_config.Env
        | default([], true)
      }}
    qbittorrent_existing_fail_closed_mounts: >-
      {{
        qbittorrent_existing_fail_closed_container_inspect.Mounts
        | default([], true)
      }}
    qbittorrent_existing_fail_closed_mount_destinations: >-
      {{
        qbittorrent_existing_fail_closed_mounts
        | map(attribute='Destination')
        | list
      }}
    qbittorrent_expected_fail_closed_mount_destinations: >-
      {{
        [
          '/config',
          '/etc/resolv.conf',
          qbittorrent_download_bind_path,
        ]
        | sort
      }}
    qbittorrent_existing_fail_closed_proxy_environment: >-
      {{
        qbittorrent_existing_fail_closed_environment
        | select(
          'match',
          '^(?:HTTP_PROXY|HTTPS_PROXY|NO_PROXY|ALL_PROXY|FTP_PROXY|http_proxy|https_proxy|no_proxy|all_proxy|ftp_proxy)='
        )
        | list
        | sort
      }}
    qbittorrent_expected_neutral_proxy_environment:
      - ALL_PROXY=
      - FTP_PROXY=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
      - all_proxy=
      - ftp_proxy=
      - http_proxy=
      - https_proxy=
      - no_proxy=
    qbittorrent_existing_fail_closed_unit_active_state: >-
      {{
        qbittorrent_pre_mutation_unit_state_result.stdout_lines
        | select('match', '^ActiveState=')
        | first
        | regex_replace('^ActiveState=', '')
      }}
    qbittorrent_existing_fail_closed_unit_lines: >-
      {{
        (
          qbittorrent_existing_unit_content.content
          | default('')
          | b64decode
        ).splitlines()
      }}
    qbittorrent_existing_fail_closed_helper_path: >-
      {{
        devture_systemd_docker_base_systemd_path
        + '/'
        + qbittorrent_identifier
        + '-container-network-helper'
      }}
  ansible.builtin.set_fact:
    qbittorrent_existing_container_fail_closed_contract_valid: >-
      {{
        qbittorrent_existing_fail_closed_target_identity_valid | bool
        and
        qbittorrent_existing_fail_closed_owner_contract_valid | bool
        and
        qbittorrent_existing_helper_has_fail_closed_contract | bool
        and qbittorrent_existing_fail_closed_unit_active_state == 'active'
        and
        '# MASH-Role=qBittorrent'
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          '# MASH-NetworkNamespaceOwner='
          + qbittorrent_container_network_container
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        '# MASH-NetworkNamespaceIdentity=resolved-full-container-id'
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          'BindsTo='
          + qbittorrent_container_network_container_systemd_service
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          'After='
          + qbittorrent_container_network_container_systemd_service
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          'ExecStartPre='
          + qbittorrent_existing_fail_closed_helper_path
          + ' cleanup'
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          'ExecStartPre='
          + qbittorrent_existing_fail_closed_helper_path
          + ' prepare'
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        (
          'ExecStart='
          + qbittorrent_existing_fail_closed_helper_path
          + ' start'
        )
        in qbittorrent_existing_fail_closed_unit_lines
        and
        qbittorrent_existing_fail_closed_container_inspect.Id
        == qbittorrent_existing_container_fail_closed_contract_id
        and
        qbittorrent_existing_fail_closed_container_inspect.Name
        == '/' + qbittorrent_identifier
        and
        qbittorrent_existing_fail_closed_container_inspect.State.Running
        | default(false)
        | bool
        and
        qbittorrent_existing_fail_closed_host_config.NetworkMode
        | default('')
        == 'container:' + qbittorrent_existing_fail_closed_owner_id
        and
        qbittorrent_existing_fail_closed_labels.get(
          'io.mash.qbittorrent.owner',
          ''
        )
        == qbittorrent_identifier
        and
        qbittorrent_existing_fail_closed_labels.get(
          'io.mash.qbittorrent.fail-closed-contract',
          ''
        )
        == 'v1'
        and
        qbittorrent_existing_fail_closed_host_config.PortBindings
        | default({}, true)
        | length
        == 0
        and not
        qbittorrent_existing_fail_closed_host_config.PublishAllPorts
        | default(false)
        | bool
        and not
        qbittorrent_existing_fail_closed_host_config.Privileged
        | default(true)
        | bool
        and
        qbittorrent_existing_fail_closed_host_config.AutoRemove
        | default(false)
        | bool
        and
        qbittorrent_existing_fail_closed_host_config.ReadonlyRootfs
        | default(false)
        | bool
        and
        qbittorrent_existing_fail_closed_host_config.CapDrop
        | default([], true)
        | map('upper')
        | list
        | sort
        == ['ALL']
        and
        qbittorrent_existing_fail_closed_host_config.CapAdd
        | default([], true)
        | map('upper')
        | list
        | sort
        ==
        ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETGID', 'SETUID']
        | sort
        and
        qbittorrent_existing_fail_closed_config.User
        | default('')
        is match('^[1-9][0-9]*:[1-9][0-9]*$')
        and
        qbittorrent_existing_fail_closed_host_config.Devices
        | default([], true)
        | length
        == 0
        and
        qbittorrent_existing_fail_closed_host_config.DeviceRequests
        | default([], true)
        | length
        == 0
        and qbittorrent_existing_fail_closed_mounts | length == 3
        and
        qbittorrent_existing_fail_closed_mount_destinations
        | sort
        == qbittorrent_expected_fail_closed_mount_destinations
        and
        qbittorrent_existing_fail_closed_mounts
        | selectattr('Source', 'equalto', qbittorrent_data_path)
        | selectattr('Destination', 'equalto', '/config')
        | selectattr('Type', 'equalto', 'bind')
        | selectattr('RW', 'equalto', true)
        | list
        | length
        == 1
        and
        qbittorrent_existing_fail_closed_mounts
        | selectattr('Source', 'equalto', qbittorrent_download_path)
        | selectattr('Destination', 'equalto', qbittorrent_download_bind_path)
        | selectattr('Type', 'equalto', 'bind')
        | selectattr('RW', 'equalto', true)
        | list
        | length
        == 1
        and
        qbittorrent_existing_fail_closed_mounts
        | selectattr(
          'Source',
          'equalto',
          qbittorrent_container_network_container_resolv_conf_path
        )
        | selectattr('Destination', 'equalto', '/etc/resolv.conf')
        | selectattr('Type', 'equalto', 'bind')
        | rejectattr('RW')
        | list
        | length
        == 1
        and
        qbittorrent_existing_fail_closed_mounts
        | map(attribute='Source')
        | select(
          'search',
          '(?:^|/)(?:docker|podman|containerd|crio)[.]sock(?:/|$)'
        )
        | list
        | length
        == 0
        and
        qbittorrent_existing_fail_closed_proxy_environment
        == qbittorrent_expected_neutral_proxy_environment
        and
        qbittorrent_existing_fail_closed_environment
        | select('match', '^(?:OPENVPN|WIREGUARD|VPN_)')
        | list
        | length
        == 0
      }}
  no_log: true
