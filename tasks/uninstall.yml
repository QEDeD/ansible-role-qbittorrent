---
- name: Quiesce qBittorrent before uninstall lifecycle mutation
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/quiesce.yml"

- name: Check existence of qBittorrent systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ qbittorrent_identifier }}.service"
  register: qbittorrent_service_stat

- name: Capture the exact qBittorrent container identity before uninstall
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - "name=^/{{ qbittorrent_identifier | replace('.', '[.]') }}$"
      - "--format={{ '{{' }}.ID{{ '}}' }}|{{ '{{' }}.Names{{ '}}' }}"
  register: qbittorrent_uninstall_container_query_result
  changed_when: false
  failed_when: false

- name: Record exact qBittorrent container query results during uninstall
  ansible.builtin.set_fact:
    qbittorrent_uninstall_container_query_lines: >-
      {{
        qbittorrent_uninstall_container_query_result.stdout_lines
        | default([])
        | reject('equalto', '')
        | list
      }}
    qbittorrent_uninstall_container_id: ""
    qbittorrent_uninstall_container_owned: false

- name: Validate exact qBittorrent container capture during uninstall
  ansible.builtin.set_fact:
    qbittorrent_uninstall_container_capture_valid: >-
      {{
        qbittorrent_uninstall_container_query_result.rc == 0
        and
        (
          qbittorrent_uninstall_container_query_lines | length == 0
          or
          (
            qbittorrent_uninstall_container_query_lines | length == 1
            and
            qbittorrent_uninstall_container_query_lines[0].split('|') | length == 2
            and
            qbittorrent_uninstall_container_query_lines[0].split('|')[1]
            == qbittorrent_identifier
            and
            qbittorrent_uninstall_container_query_lines[0].split('|')[0]
            is match('^[a-f0-9]{64}$')
          )
        )
      }}

- name: Resolve the exact qBittorrent container ID during uninstall
  when:
    - qbittorrent_uninstall_container_query_result.rc == 0
    - qbittorrent_uninstall_container_query_lines | length == 1
    - qbittorrent_uninstall_container_query_lines[0].split('|') | length == 2
    - qbittorrent_uninstall_container_query_lines[0].split('|')[1] == qbittorrent_identifier
    - qbittorrent_uninstall_container_query_lines[0].split('|')[0] is match('^[a-f0-9]{64}$')
  ansible.builtin.set_fact:
    qbittorrent_uninstall_container_id: >-
      {{ qbittorrent_uninstall_container_query_lines[0].split('|')[0] }}

- name: Inspect the captured qBittorrent container ownership before uninstall
  when: qbittorrent_uninstall_container_id | length > 0
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - inspect
      - "--format={{ '{{' }}.Id{{ '}}' }}|{{ '{{' }}.Name{{ '}}' }}|{{ '{{' }}index .Config.Labels \"io.mash.qbittorrent.owner\"{{ '}}' }}"
      - "{{ qbittorrent_uninstall_container_id }}"
  register: qbittorrent_uninstall_container_inspect_result
  changed_when: false
  failed_when: false

- name: Record positively identified qBittorrent container ownership
  when: qbittorrent_uninstall_container_id | length > 0
  ansible.builtin.set_fact:
    qbittorrent_uninstall_container_owned: >-
      {{
        qbittorrent_uninstall_container_inspect_result.rc == 0
        and
        (
          qbittorrent_uninstall_container_inspect_result.stdout
          | trim
          | split('|')
          | length
        )
        == 3
        and
        (
          qbittorrent_uninstall_container_inspect_result.stdout
          | trim
          | split('|')
          | first
        )
        == qbittorrent_uninstall_container_id
        and
        (
          qbittorrent_uninstall_container_inspect_result.stdout
          | trim
          | split('|')
        )[1]
        == '/' + qbittorrent_identifier
        and
        (
          (
            qbittorrent_uninstall_container_inspect_result.stdout
            | trim
            | split('|')
            | last
          )
          == qbittorrent_identifier
          or
          (
            qbittorrent_quiesce_applied | default(false) | bool
            and
            qbittorrent_quiesce_container_id
            == qbittorrent_uninstall_container_id
          )
        )
      }}

- name: Attempt to stop qBittorrent systemd during uninstall
  ansible.builtin.command:
    argv:
      - "{{ qbittorrent_systemd_systemctl_command }}"
      - stop
      - "{{ qbittorrent_identifier }}.service"
  register: qbittorrent_uninstall_systemd_stop_result
  changed_when: false
  failed_when: false

- name: Attempt to disable qBittorrent systemd during uninstall
  when: qbittorrent_service_stat.stat.exists | bool
  ansible.builtin.command:
    argv:
      - "{{ qbittorrent_systemd_systemctl_command }}"
      - disable
      - "{{ qbittorrent_identifier }}.service"
  register: qbittorrent_uninstall_systemd_disable_result
  changed_when: false
  failed_when: false

- name: Remove only the captured role-owned qBittorrent container ID during uninstall
  when:
    - qbittorrent_uninstall_container_id | length > 0
    - qbittorrent_uninstall_container_owned | bool
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - rm
      - --force
      - "{{ qbittorrent_uninstall_container_id }}"
  register: qbittorrent_uninstall_original_id_remove_result
  changed_when: qbittorrent_uninstall_original_id_remove_result.rc == 0
  failed_when: false

- name: Query the exact qBittorrent container name after uninstall cleanup
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - "name=^/{{ qbittorrent_identifier | replace('.', '[.]') }}$"
      - "--format={{ '{{' }}.ID{{ '}}' }}|{{ '{{' }}.Names{{ '}}' }}"
  register: qbittorrent_uninstall_container_proof_result
  changed_when: false
  failed_when: false

- name: Initialize original qBittorrent container-ID uninstall proof
  ansible.builtin.set_fact:
    qbittorrent_uninstall_original_id_absent: >-
      {{ qbittorrent_uninstall_container_id | length == 0 }}

- name: Query the original qBittorrent container ID after uninstall cleanup
  when: qbittorrent_uninstall_container_id | length > 0
  ansible.builtin.command:
    argv:
      - "{{ devture_systemd_docker_base_host_command_docker }}"
      - container
      - ls
      - --all
      - --no-trunc
      - --filter
      - "id={{ qbittorrent_uninstall_container_id }}"
      - "--format={{ '{{' }}.ID{{ '}}' }}"
  register: qbittorrent_uninstall_original_id_proof_result
  changed_when: false
  failed_when: false

- name: Record original qBittorrent container-ID uninstall proof
  when: qbittorrent_uninstall_container_id | length > 0
  ansible.builtin.set_fact:
    qbittorrent_uninstall_original_id_absent: >-
      {{
        qbittorrent_uninstall_original_id_proof_result.rc == 0
        and
        (
          qbittorrent_uninstall_original_id_proof_result.stdout_lines
          | default([])
          | reject('equalto', '')
          | list
          | length
        )
        == 0
      }}

- name: Query qBittorrent systemd state after uninstall cleanup
  ansible.builtin.command:
    argv:
      - "{{ qbittorrent_systemd_systemctl_command }}"
      - is-active
      - "{{ qbittorrent_identifier }}.service"
  register: qbittorrent_uninstall_systemd_state_result
  changed_when: false
  failed_when: false

- name: Fail if qBittorrent uninstall isolation could not be proven
  ansible.builtin.assert:
    that:
      - >-
        qbittorrent_uninstall_systemd_state_result.stdout
        | trim
        in ['inactive', 'failed', 'unknown']
      - qbittorrent_uninstall_container_capture_valid | bool
      - qbittorrent_uninstall_container_proof_result.rc == 0
      - >-
        qbittorrent_uninstall_container_proof_result.stdout_lines
        | default([])
        | reject('equalto', '')
        | list
        | length
        == 0
      - qbittorrent_uninstall_original_id_absent | bool
      - >-
        not qbittorrent_service_stat.stat.exists | bool
        or qbittorrent_uninstall_systemd_disable_result.rc | default(1) == 0
    fail_msg: >-
      qBittorrent systemd inactivity and absence of both the captured container
      ID and stable Docker name must be proven before uninstall removes files.
      An unlabelled legacy leftover or later same-name replacement is retained
      rather than deleted.

- name: Revalidate qBittorrent primary paths immediately before file removal
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_paths.yml"

- name: Ensure qBittorrent systemd service does not exist
  ansible.builtin.file:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ qbittorrent_identifier }}.service"
    state: absent

- name: Ensure qBittorrent support files do not exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ qbittorrent_base_path }}/env"
    - "{{ qbittorrent_base_path }}/labels"
    - "{{ devture_systemd_docker_base_systemd_path }}/{{ qbittorrent_identifier }}-container-network-helper"

- name: Reload systemd after removing the qBittorrent unit
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Release qBittorrent uninstall quiescing after unit removal
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/release_quiesce.yml"
  vars:
    qbittorrent_quiesce_release_final_unit_expected: false
    qbittorrent_quiesce_release_removed_unit_expected: true

- name: Ensure qBittorrent local data path does not exist if empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ qbittorrent_data_path }}"
  register: qbittorrent_data_path_deletion_result
  changed_when: qbittorrent_data_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure qBittorrent local download data path does not exist if empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ qbittorrent_download_path }}"
  register: qbittorrent_download_path_deletion_result
  changed_when: qbittorrent_download_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure qBittorrent base path does not exist if empty
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - "{{ qbittorrent_base_path }}"
  register: qbittorrent_base_path_deletion_result
  changed_when: qbittorrent_base_path_deletion_result.rc == 0
  failed_when: false

- name: Safely remove the role-owned qBittorrent container network
  when:
    - qbittorrent_container_network_mode == 'managed'
    - qbittorrent_container_network_deletion_enabled | bool
  block:
    - name: Initialize the qBittorrent network cleanup identity
      ansible.builtin.set_fact:
        qbittorrent_uninstall_network_id: ""
        qbittorrent_uninstall_network_owned: false

    - name: Query the exact qBittorrent network name for removal
      ansible.builtin.command:
        argv:
          - "{{ devture_systemd_docker_base_host_command_docker }}"
          - network
          - ls
          - --no-trunc
          - --quiet
          - --filter
          - "name=^{{ qbittorrent_container_network | replace('.', '[.]') }}$"
      register: qbittorrent_uninstall_network_query_result
      changed_when: false

    - name: Validate the exact qBittorrent network query for removal
      ansible.builtin.assert:
        that:
          - >-
            qbittorrent_uninstall_network_query_result.stdout
            | trim
            | length
            == 0
            or
            (
              qbittorrent_uninstall_network_query_result.stdout_lines
              | length
              == 1
              and
              qbittorrent_uninstall_network_query_result.stdout_lines[0]
              is match('^[a-f0-9]{64}$')
            )
        fail_msg: >-
          The exact qBittorrent network query was ambiguous. No network was
          removed.

    - name: Record the exact qBittorrent network identity for removal
      when: qbittorrent_uninstall_network_query_result.stdout_lines | length == 1
      ansible.builtin.set_fact:
        qbittorrent_uninstall_network_id: >-
          {{ qbittorrent_uninstall_network_query_result.stdout_lines[0] }}

    - name: Inspect the exact qBittorrent network before removal
      when: qbittorrent_uninstall_network_id | length > 0
      ansible.builtin.command:
        argv:
          - "{{ devture_systemd_docker_base_host_command_docker }}"
          - network
          - inspect
          - "--format={{ '{{' }}.Id{{ '}}' }}|{{ '{{' }}.Name{{ '}}' }}|{{ '{{' }}index .Labels \"io.mash.qbittorrent.owner\"{{ '}}' }}"
          - "{{ qbittorrent_uninstall_network_id }}"
      register: qbittorrent_uninstall_network_inspect_result
      changed_when: false

    - name: Record positive qBittorrent network ownership
      when: qbittorrent_uninstall_network_id | length > 0
      vars:
        qbittorrent_uninstall_network_inspect_fields: >-
          {{ qbittorrent_uninstall_network_inspect_result.stdout.split('|') }}
      ansible.builtin.set_fact:
        qbittorrent_uninstall_network_owned: >-
          {{
            qbittorrent_uninstall_network_inspect_fields | length == 3
            and qbittorrent_uninstall_network_inspect_fields[0]
            == qbittorrent_uninstall_network_id
            and qbittorrent_uninstall_network_inspect_fields[1]
            == qbittorrent_container_network
            and qbittorrent_uninstall_network_inspect_fields[2]
            == qbittorrent_identifier
          }}

    - name: Remove only the exact role-owned qBittorrent network ID
      when:
        - qbittorrent_uninstall_network_id | length > 0
        - qbittorrent_uninstall_network_owned | bool
      ansible.builtin.command:
        argv:
          - "{{ devture_systemd_docker_base_host_command_docker }}"
          - network
          - rm
          - "{{ qbittorrent_uninstall_network_id }}"
      register: qbittorrent_network_deletion_result
      changed_when: qbittorrent_uninstall_network_id in qbittorrent_network_deletion_result.stdout

    - name: Prove the exact role-owned qBittorrent network ID is absent
      when:
        - qbittorrent_uninstall_network_id | length > 0
        - qbittorrent_uninstall_network_owned | bool
      ansible.builtin.command:
        argv:
          - "{{ devture_systemd_docker_base_host_command_docker }}"
          - network
          - ls
          - --no-trunc
          - --quiet
          - --filter
          - "id={{ qbittorrent_uninstall_network_id }}"
      register: qbittorrent_uninstall_network_absence_result
      changed_when: false

    - name: Require the removed qBittorrent network identity to remain absent
      when:
        - qbittorrent_uninstall_network_id | length > 0
        - qbittorrent_uninstall_network_owned | bool
      ansible.builtin.assert:
        that:
          - qbittorrent_uninstall_network_absence_result.rc == 0
          - >-
            qbittorrent_uninstall_network_absence_result.stdout
            | trim
            | length
            == 0
        fail_msg: >-
          The captured role-owned qBittorrent network ID is still present after
          removal.

    - name: Report a retained legacy or unowned qBittorrent network
      when:
        - qbittorrent_uninstall_network_id | length > 0
        - not qbittorrent_uninstall_network_owned | bool
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: >-
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              'The qBittorrent network `' + qbittorrent_container_network
              + '` was retained because it lacks the role-owned network label.'
            ]
          }}

- name: Check existence of qBittorrent local data path
  ansible.builtin.stat:
    path: "{{ qbittorrent_data_path }}"
  register: qbittorrent_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining qBittorrent local data path
  when: qbittorrent_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local qBittorrent instance has been removed, local data remains in `" + qbittorrent_data_path + "`. Feel free to delete it."
        ]
      }}

- name: Check existence of qBittorrent local download data path
  ansible.builtin.stat:
    path: "{{ qbittorrent_download_path }}"
  register: qbittorrent_download_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining qBittorrent local download data path
  when: qbittorrent_download_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local qBittorrent instance has been removed, local data remains in `" + qbittorrent_download_path + "`. Feel free to delete it."
        ]
      }}
