---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "qbittorrent_container_torrenting_bind_port", "new": "qbittorrent_container_torrenting_host_bind_port" }
    - { "old": "qbittorrent_container_webui_bind_port", "new": "qbittorrent_container_http_host_bind_port" }
    - { "old": "qbittorrent_container_webui_port", "new": "qbittorrent_container_http_port" }
    - { "old": "qbittorrent_container_additional_environment_variables", "new": "qbittorrent_environment_variables_additional_variables" }
    - { "old": "qbittorrent_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required qBittorrent settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - qbittorrent_uid
    - qbittorrent_gid
    - qbittorrent_hostname
    - qbittorrent_path_prefix
    - qbittorrent_container_network_mode

- name: Validate qBittorrent primary filesystem paths
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_paths.yml"

- name: Fail if qBittorrent container network mode is unsupported
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_mode must be one of `managed` or `container`,
      but it is set to `{{ qbittorrent_container_network_mode }}`.
  when: qbittorrent_container_network_mode not in ['managed', 'container']

- name: Validate an enforced qBittorrent network-policy contract
  when: qbittorrent_container_network_enforcement_enabled | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_container_network_enforcement_intent is boolean
      - qbittorrent_container_network_enforcement_owner_enabled is boolean
      - >-
        (
          qbittorrent_container_network_enforcement_intent | bool
          and qbittorrent_container_network_enforcement_owner_enabled | bool
          and qbittorrent_container_network_mode == 'container'
          and
          qbittorrent_container_network_container
          ==
          qbittorrent_container_network_enforcement_expected_owner_container
          and
          qbittorrent_container_network_container_systemd_service
          ==
          qbittorrent_container_network_enforcement_expected_owner_systemd_service
          and
          qbittorrent_container_network_container_resolv_conf_path
          ==
          qbittorrent_container_network_enforcement_expected_resolv_conf_path
          and
          qbittorrent_container_network_container_contract_label
          ==
          qbittorrent_container_network_enforcement_expected_owner_contract_label
          and
          qbittorrent_container_network_container_contract_label_value
          ==
          qbittorrent_container_network_enforcement_expected_owner_contract_label_value
          and qbittorrent_container_hostname | length == 0
          and qbittorrent_container_network | length == 0
          and not qbittorrent_container_network_deletion_enabled | bool
          and qbittorrent_container_http_host_bind_port | length == 0
          and qbittorrent_container_torrenting_host_bind_port | length == 0
          and qbittorrent_container_additional_networks | length == 0
          and qbittorrent_container_extra_arguments | length == 0
          and
          qbittorrent_container_labels_traefik_enabled | bool
          ==
          qbittorrent_container_network_enforcement_expected_traefik_labels_enabled
          | bool
          and
          qbittorrent_container_labels_traefik_docker_network
          ==
          qbittorrent_container_network_enforcement_expected_traefik_network
        )
        or
        (
          not qbittorrent_container_network_enforcement_intent | bool
          and not qbittorrent_container_network_enforcement_owner_enabled | bool
          and qbittorrent_container_network_mode == 'managed'
          and qbittorrent_container_network_container | length == 0
          and
          qbittorrent_container_network_container_systemd_service | length
          == 0
          and
          qbittorrent_container_network_container_resolv_conf_path | length
          == 0
          and
          qbittorrent_container_network_container_contract_label | length
          == 0
          and
          qbittorrent_container_network_container_contract_label_value | length
          == 0
        )
    fail_msg: >-
      The effective qBittorrent network settings contradict the parent
      playbook's enforced VPN intent. A VPN intent requires the exact enabled
      namespace owner and container-mode coupling; a direct-network intent
      rejects stale namespace-owner coupling.

- name: Fail if qBittorrent identifier is not an unambiguous exact Docker name
  ansible.builtin.fail:
    msg: >-
      qbittorrent_identifier must be a stable Docker name containing only letters,
      digits, underscores, periods, and hyphens; it must not look like a Docker ID.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_identifier is not match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      or qbittorrent_identifier is match('^[a-f0-9]+$')

- name: Fail if qBittorrent systemctl command path is unsafe
  ansible.builtin.fail:
    msg: >-
      qbittorrent_systemd_systemctl_command must be an absolute executable path
      containing only letters, digits, underscores, periods, slashes, and hyphens.
  when:
    - qbittorrent_container_network_mode == 'container'
    - qbittorrent_systemd_systemctl_command is not match('^/[A-Za-z0-9_./-]+$')

- name: Fail if required qBittorrent managed-network settings are not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required managed-network configuration setting (`{{ item }}`).
  when:
    - qbittorrent_container_network_mode == 'managed'
    - lookup('vars', item, default='') | string | length == 0
  with_items:
    - qbittorrent_container_hostname
    - qbittorrent_container_network

- name: Fail if qBittorrent namespace-owner settings are set in managed-network mode
  ansible.builtin.fail:
    msg: >-
      {{ item }} is only valid when qbittorrent_container_network_mode is
      `container`.
  when:
    - qbittorrent_container_network_mode == 'managed'
    - lookup('vars', item, default='') | string | length > 0
  loop:
    - qbittorrent_container_network_container
    - qbittorrent_container_network_container_contract_label
    - qbittorrent_container_network_container_contract_label_value
    - qbittorrent_container_network_container_systemd_service
    - qbittorrent_container_network_container_resolv_conf_path

- name: Fail if required qBittorrent namespace-owner settings are not defined
  ansible.builtin.fail:
    msg: >-
      You need to define {{ item }} when qbittorrent_container_network_mode is
      `container`.
  when:
    - qbittorrent_container_network_mode == 'container'
    - lookup('vars', item, default='') | string | length == 0
  loop:
    - qbittorrent_container_network_container
    - qbittorrent_container_network_container_contract_label
    - qbittorrent_container_network_container_contract_label_value
    - qbittorrent_container_network_container_systemd_service
    - qbittorrent_container_network_container_resolv_conf_path

- name: Fail if qBittorrent namespace-owner contract label is unsafe
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_contract_label must be a
      single-line Docker label key containing only letters, digits,
      underscores, periods, and hyphens.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_contract_label
      is not match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')

- name: Fail if qBittorrent namespace-owner contract label value is unsafe
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_contract_label_value must be a
      non-empty single-line value without Docker-inspection delimiters.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_contract_label_value
      is not match('^[^|\r\n]+$')

- name: Fail if qBittorrent namespace-owner resolver path is invalid
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_resolv_conf_path must be an
      absolute string path without commas or control characters.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_resolv_conf_path is not string
      or
      (
        qbittorrent_container_network_container_resolv_conf_path
        is not match('^/(?!/)[^,\r\n]+$')
      )
      or
      qbittorrent_container_network_container_resolv_conf_path
      is search('[\x00-\x1f\x7f]')
      or
      '//' in qbittorrent_container_network_container_resolv_conf_path
      or
      qbittorrent_container_network_container_resolv_conf_path
      is search('(?:^|/)[.]{1,2}(?:/|$)')

- name: Fail if qBittorrent namespace-owner resolver path exposes host control
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_resolv_conf_path must not expose
      a container-engine control socket, the host root, /proc, /sys, /dev, or a
      broad control-bearing parent path.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_resolv_conf_path
      is match('^/(?:$|bin(?:/|$)|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|lib(?:32|64)?(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sbin(?:/|$)|sys(?:/|$)|usr(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
      or
      qbittorrent_container_network_container_resolv_conf_path
      is search('(?:^|/)(?:docker|podman|containerd|crio)[.]sock(?:/|$)')

- name: Resolve the qBittorrent namespace-owner resolver path before rendering
  when: qbittorrent_container_network_mode == 'container'
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - --canonicalize-missing
      - --
      - "{{ qbittorrent_container_network_container_resolv_conf_path }}"
  register: qbittorrent_container_network_resolver_path_resolution_result
  changed_when: false

- name: Require the qBittorrent namespace-owner resolver path to be canonical
  when: qbittorrent_container_network_mode == 'container'
  ansible.builtin.assert:
    that:
      - qbittorrent_container_network_resolver_path_resolution_result.rc == 0
      - >-
        qbittorrent_container_network_resolver_path_resolution_result.stdout_lines
        | length
        == 1
      - >-
        qbittorrent_container_network_resolver_path_resolution_result.stdout
        | trim
        ==
        qbittorrent_container_network_container_resolv_conf_path
    fail_msg: >-
      qbittorrent_container_network_container_resolv_conf_path must not contain
      or currently traverse a symbolic link.

- name: Fail if qBittorrent namespace-owner container is not a stable exact Docker name
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container must be a stable Docker name
      containing only letters, digits, underscores, periods, and hyphens.
  when:
    - qbittorrent_container_network_mode == 'container'
    - qbittorrent_container_network_container is not match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')

- name: Fail if qBittorrent namespace-owner container refers to itself
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container must not refer to the qBittorrent
      container itself.
  when:
    - qbittorrent_container_network_mode == 'container'
    - qbittorrent_container_network_container == qbittorrent_identifier

- name: Fail if qBittorrent namespace-owner systemd service name is unsafe
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_systemd_service must be a `.service`
      unit name containing only letters, digits, colons, underscores, periods,
      at-signs, and hyphens.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_systemd_service
      is not match('^[A-Za-z0-9][A-Za-z0-9:_.@-]*[.]service$')

- name: Fail if qBittorrent namespace-owner systemd service refers to qBittorrent
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_systemd_service must not refer to
      the qBittorrent service itself.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_systemd_service
      == qbittorrent_identifier + '.service'

- name: Fail if qBittorrent namespace-owner service is missing from the resolved bound services
  ansible.builtin.fail:
    msg: >-
      qbittorrent_systemd_binds_to_services_list must contain
      qbittorrent_container_network_container_systemd_service in
      container-network mode. Do not override the resolved list in a way that
      removes the namespace-owner lifecycle dependency.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_systemd_service
      not in qbittorrent_systemd_binds_to_services_list

- name: Fail if a qBittorrent dependency service name is unsafe
  ansible.builtin.fail:
    msg: >-
      A qBittorrent required, wanted, or bound service list contains an unsafe
      service name (`{{ item }}`). Every entry must be a safely formed
      `.service` unit name and must not refer to qBittorrent itself.
  when:
    - >-
      item | string is not match('^[A-Za-z0-9][A-Za-z0-9:_.@-]*[.]service$')
      or item == qbittorrent_identifier + '.service'
  loop: >-
    {{
      (
        qbittorrent_systemd_required_services_list
        + qbittorrent_systemd_wanted_services_list
        + qbittorrent_systemd_binds_to_services_list
      )
      | unique
    }}

- name: Fail if qBittorrent container mode would run as root
  ansible.builtin.fail:
    msg: >-
      qbittorrent_uid and qbittorrent_gid must both be numeric and non-zero in
      container-network mode.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_uid | string is not match('^[0-9]+$')
      or qbittorrent_gid | string is not match('^[0-9]+$')
      or qbittorrent_uid | int == 0
      or qbittorrent_gid | int == 0

- name: Fail if fixed qBittorrent ownership metadata was overridden
  ansible.builtin.fail:
    msg: >-
      qBittorrent ownership and fail-closed contract metadata are role-owned
      and cannot be overridden.
  when:
    - >-
      qbittorrent_container_role_label != 'io.mash.qbittorrent.owner'
      or qbittorrent_container_role_label_value != qbittorrent_identifier
      or
      qbittorrent_container_fail_closed_contract_label
      != 'io.mash.qbittorrent.fail-closed-contract'
      or
      qbittorrent_container_fail_closed_contract_label_value != 'v1'

- name: Fail if an additional qBittorrent label is multiline
  ansible.builtin.fail:
    msg: qBittorrent additional container labels must be single-line strings.
  when:
    - item is not string or '\n' in item or '\r' in item
  loop: "{{ qbittorrent_container_labels_additional_labels }}"

- name: Fail if an additional qBittorrent label overrides role metadata
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_labels_additional_labels must not define either
      role-owned ownership or fail-closed contract label.
  when:
    - >-
      item
      is match(
        '^' + (qbittorrent_container_role_label | regex_escape) + '='
      )
      or
      item
      is match(
        '^'
        + (qbittorrent_container_fail_closed_contract_label | regex_escape)
        + '='
      )
  loop: "{{ qbittorrent_container_labels_additional_labels }}"

- name: Fail if a primary qBittorrent container-network bind source is unsafe
  ansible.builtin.fail:
    msg: >-
      {{ item.name }} must be an absolute canonical application-data path and
      must not expose a host-control tree or container-engine socket in
      container-network mode (`{{ item.path }}`).
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      item.path | string is not match('^/')
      or item.path | string is search('(?:^|/)[.]{1,2}(?:/|$)')
      or
      item.path | string
      is match(
        '^/(?:$|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sys(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))'
      )
      or
      item.path | string
      is search('(?:^|/)(?:docker|podman|containerd|crio)[.]sock(?:/|$)')
  loop:
    - name: qbittorrent_data_path
      path: "{{ qbittorrent_data_path }}"
    - name: qbittorrent_download_path
      path: "{{ qbittorrent_download_path }}"

- name: Fail if qBittorrent download destination is unsafe or overlaps support mounts
  ansible.builtin.fail:
    msg: >-
      qbittorrent_download_bind_path must be an absolute canonical application
      path which does not overlap /config, /etc/resolv.conf, or /run in
      container-network mode.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_download_bind_path | string is not match('^/')
      or qbittorrent_download_bind_path | string is not match('^/(?!/)[^,\r\n]+$')
      or '//' in (qbittorrent_download_bind_path | string)
      or
      qbittorrent_download_bind_path | string
      is search('(?:^|/)[.]{1,2}(?:/|$)')
      or
      qbittorrent_download_bind_path | string
      is match('^/(?:$|config|dev|etc|proc|run|sys)(?:/|$)')

- name: Fail if qBittorrent Traefik network is not defined in container-network mode
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_labels_traefik_docker_network must identify a network
      attached to the namespace owner when Traefik labels are enabled in
      container-network mode.
  when:
    - qbittorrent_container_network_mode == 'container'
    - qbittorrent_container_labels_traefik_enabled | bool
    - qbittorrent_container_labels_traefik_docker_network | string | length == 0

- name: Fail if qBittorrent namespace-owner timing settings are invalid
  ansible.builtin.fail:
    msg: >-
      {{ item }} must be an integer greater than or equal to 1.
  when:
    - qbittorrent_container_network_mode == 'container'
    - lookup('vars', item) | string is not match('^[0-9]+$')
      or lookup('vars', item) | int < 1
  loop:
    - qbittorrent_container_network_container_healthcheck_retries
    - qbittorrent_container_network_container_healthcheck_retry_delay_seconds
    - qbittorrent_container_network_container_systemd_start_timeout_margin_seconds
    - qbittorrent_container_network_container_systemd_start_timeout_seconds
    - qbittorrent_container_stop_grace_time_seconds

- name: Fail if qBittorrent container-network systemd startup timeout is below its work budget
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_container_systemd_start_timeout_seconds must
      cover namespace-owner health-check retries and the configured cleanup/create
      margin.
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      qbittorrent_container_network_container_systemd_start_timeout_seconds | int
      <
      (
        (qbittorrent_container_network_container_healthcheck_retries | int)
        *
        (qbittorrent_container_network_container_healthcheck_retry_delay_seconds | int)
      )
      +
      (qbittorrent_container_stop_grace_time_seconds | int)
      +
      (qbittorrent_container_network_container_systemd_start_timeout_margin_seconds | int)

- name: Reject qBittorrent extension points which can expose secrets or host control
  when: qbittorrent_container_network_mode == 'container'
  ansible.builtin.assert:
    that:
      - >-
        qbittorrent_environment_variables_additional_variables
        | type_debug
        == 'str'
      - >-
        qbittorrent_environment_variables_additional_variables
        | trim
        | length
        == 0
      - qbittorrent_container_additional_volumes | length == 0
    fail_msg: >-
      Container-network mode requires both
      qbittorrent_environment_variables_additional_variables and
      qbittorrent_container_additional_volumes to be empty. Arbitrary
      environment or mount extension points cannot be proven free of VPN
      credentials, proxy paths, or host-control sockets.
  no_log: true

- name: Fail if qBittorrent container-network mode has a host-control volume
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_additional_volumes must not expose Docker sockets,
      host-control trees, or the enforced /config and /etc mounts to
      qBittorrent in container-network mode
      (`{{ item.src | default('') }}` -> `{{ item.dst | default('') }}`).
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      item.src | default('') | string
      is match('^/(?:$|bin(?:/|$)|boot(?:/|$)|dev(?:/|$)|etc(?:/|$)|lib(?:32|64)?(?:/|$)|proc(?:/|$)|root(?:/|$)|run(?:/|$)|sbin(?:/|$)|sys(?:/|$)|usr(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
      or
      item.src | default('') | string
      is search('(?:^|/)(?:docker|podman|containerd|crio)[.]sock(?:/|$)')
      or
      item.dst | default('') | string
      is match('^/(?:$|config(?:/|$)|dev(?:/|$)|etc(?:/|$)|proc(?:/|$)|run(?:/|$)|sys(?:/|$)|var/?$|var/run(?:/|$)|var/lib/?$|var/lib/(?:docker|containers|containerd|podman)(?:/|$))')
      or
      item.dst | default('') | string
      is search('(?:^|/)(?:docker|podman|containerd|crio)[.]sock(?:/|$)')
  loop: "{{ qbittorrent_container_additional_volumes }}"

- name: Fail if a qBittorrent container-network bind source is unsafe
  ansible.builtin.fail:
    msg: >-
      Every bind source in qbittorrent_container_additional_volumes must be an
      absolute host path without `.` or `..` path segments in container-network
      mode (`{{ item.src | default('') }}`).
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      (
        item.type
        | default(
          'bind'
          if '/' in (item.src | default('') | string)
          else 'volume'
        )
      )
      == 'bind'
    - >-
      item.src | default('') | string is not match('^/')
      or
      item.src | default('') | string
      is not match('^/(?!/)[^,\r\n]+$')
      or
      item.src | default('') | string is search('[\x00-\x1f\x7f]')
      or '//' in (item.src | default('') | string)
      or
      item.src | default('') | string is search('(?:^|/)[.]{1,2}(?:/|$)')
  loop: "{{ qbittorrent_container_additional_volumes }}"

- name: Resolve qBittorrent container-network bind sources
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      (
        item.type
        | default(
          'bind'
          if '/' in (item.src | default('') | string)
          else 'volume'
        )
      )
      == 'bind'
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - --canonicalize-missing
      - --
      - "{{ item.src }}"
  loop: "{{ qbittorrent_container_additional_volumes }}"
  register: qbittorrent_container_network_bind_source_resolution_results
  changed_when: false

- name: Require qBittorrent container-network bind sources to be canonical
  when: not item.skipped | default(false)
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout_lines | length == 1
      - item.stdout | trim == item.item.src
    fail_msg: >-
      qBittorrent bind source `{{ item.item.src }}` must not contain or
      currently traverse a symbolic link in container-network mode.
  loop: >-
    {{
      qbittorrent_container_network_bind_source_resolution_results.results
      | default([])
    }}

- name: Fail if a qBittorrent container-network volume destination is unsafe
  ansible.builtin.fail:
    msg: >-
      Every qbittorrent_container_additional_volumes destination must be an
      absolute container path without `.` or `..` path segments in
      container-network mode (`{{ item.dst | default('') }}`).
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      item.dst | default('') | string is not match('^/')
      or
      item.dst | default('') | string
      is not match('^/(?!/)[^,\r\n]+$')
      or
      item.dst | default('') | string is search('[\x00-\x1f\x7f]')
      or '//' in (item.dst | default('') | string)
      or
      item.dst | default('') | string is search('(?:^|/)[.]{1,2}(?:/|$)')
      or (item.dst | default('') | string).endswith('/')
  loop: "{{ qbittorrent_container_additional_volumes }}"

- name: Fail if an additional volume overlaps the qBittorrent download mount
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_additional_volumes must not duplicate, contain, or
      be contained by qbittorrent_download_bind_path in container-network mode
      (`{{ item.dst | default('') }}` overlaps
      `{{ qbittorrent_download_bind_path }}`).
  when:
    - qbittorrent_container_network_mode == 'container'
    - >-
      (item.dst | default('') | string) == qbittorrent_download_bind_path
      or
      (item.dst | default('') | string).startswith(
        qbittorrent_download_bind_path + '/'
      )
      or
      qbittorrent_download_bind_path.startswith(
        (item.dst | default('') | string) + '/'
      )
  loop: "{{ qbittorrent_container_additional_volumes }}"

- name: Fail if qBittorrent container-network mode conflicts with independently managed container settings
  ansible.builtin.fail:
    msg: >-
      qbittorrent_container_network_mode is `container`, so `{{ item.name }}` must
      be {{ item.expected }}. The namespace owner is responsible for hostname,
      published ports, and managed networks, while arbitrary Docker arguments are
      rejected to prevent bypassing the declared network mode.
  when:
    - qbittorrent_container_network_mode == 'container'
    - item.conflicts | bool
  loop:
    - name: qbittorrent_container_hostname
      conflicts: "{{ qbittorrent_container_hostname | string | length > 0 }}"
      expected: empty
    - name: qbittorrent_container_network
      conflicts: "{{ qbittorrent_container_network | string | length > 0 }}"
      expected: empty
    - name: qbittorrent_container_network_deletion_enabled
      conflicts: "{{ qbittorrent_container_network_deletion_enabled | bool }}"
      expected: "false"
    - name: qbittorrent_container_http_host_bind_port
      conflicts: "{{ qbittorrent_container_http_host_bind_port | string | length > 0 }}"
      expected: empty
    - name: qbittorrent_container_torrenting_host_bind_port
      conflicts: "{{ qbittorrent_container_torrenting_host_bind_port | string | length > 0 }}"
      expected: empty
    - name: qbittorrent_container_additional_networks
      conflicts: "{{ qbittorrent_container_additional_networks | length > 0 }}"
      expected: an empty list
    - name: qbittorrent_container_extra_arguments
      conflicts: "{{ qbittorrent_container_extra_arguments | length > 0 }}"
      expected: an empty list

- name: Fail if qBittorrent architecture is not supported
  ansible.builtin.fail:
    msg: >-
      Your configuration specifies a CPU architecture (`{{ qbittorrent_arch }}`) which is not currently supported.
      This qBittorrent role also does not support self-building yet, so it's not possible to make use of it.
  when: "qbittorrent_arch not in ['amd64', 'arm64']"

- name: Validate qBittorrent Traefik configuration
  when: qbittorrent_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for qBittorrent are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "qbittorrent_container_labels_traefik_hostname", when: true }
        - { "name": "qbittorrent_container_labels_traefik_path_prefix", when: true }
        - { "name": "qbittorrent_container_labels_traefik_middleware_basic_auth_users", when: "{{ qbittorrent_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `qbittorrent_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if qbittorrent_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          qbittorrent_container_labels_traefik_path_prefix (`{{ qbittorrent_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/qbittorrent`).
      when: "qbittorrent_container_labels_traefik_path_prefix != '/' and qbittorrent_container_labels_traefik_path_prefix[-1] == '/'"
