---
- name: Perform qBittorrent installation tasks
  when: qbittorrent_enabled | bool
  tags:
    - setup-all
    - setup-qbittorrent
    - install-all
    - install-qbittorrent
  block:
    - name: Validate qBittorrent lifecycle mutation safety
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_uninstall.yml"
    - name: Fail closed before validating a direct-to-container transition
      when: >-
        (
          qbittorrent_container_network_mode == 'container'
          or
          (
            qbittorrent_container_network_enforcement_enabled
            | default(false)
            | bool
            and
            qbittorrent_container_network_enforcement_intent
            | default(false)
            | bool
          )
        )
        and
        (
          qbittorrent_existing_quiesce_dropin_owned | default(false) | bool
          or
          qbittorrent_existing_quiesce_cached_guard_safe | default(false) | bool
          or
          (
            qbittorrent_existing_unit_stat.stat.exists | bool
            and
            (
              not
              qbittorrent_existing_container_fail_closed_contract_valid
              | default(false)
              | bool
            )
          )
        )
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/quiesce.yml"
    - name: Validate qBittorrent configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install qBittorrent
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform tasks to print temporary password for qBittorrent
  when: qbittorrent_enabled | bool
  tags:
    - molecule-notest
    - print-qbittorrent-password
  block:
    - name: Run qBittorrent print temporary password tasks
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/print_qbittorrent_password.yml"

- name: Perform qBittorrent uninstallation tasks
  when: not qbittorrent_enabled | bool
  tags:
    - setup-all
    - setup-qbittorrent
  block:
    - name: Validate qBittorrent uninstall safety
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_uninstall.yml"
    - name: Uninstall qBittorrent
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
